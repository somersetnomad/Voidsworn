name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # If the repo's Pages source is still "Deploy from a branch", GitHub runs its
  # own build after every push and publishes the README over the game.
  # Re-deploy once that finishes so the game is always what's live.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: 1
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
